<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
  <!-- Calendar body -->
  <rect x="32" y="56" width="192" height="176" rx="14"/>
  <!-- Header divider -->
  <line x1="32" y1="104" x2="224" y2="104"/>
  <!-- Top binder rings -->
  <line x1="80" y1="32" x2="80" y2="72"/>
  <line x1="176" y1="32" x2="176" y2="72"/>

  <!-- Stylized Union Jack inside, clipped to the page area -->
  <g clip-path="inset(108 36 36 36)">
    <!-- Diagonals -->
    <line x1="36" y1="108" x2="220" y2="228"/>
    <line x1="220" y1="108" x2="36" y2="228"/>
    <!-- Cross -->
    <line x1="128" y1="104" x2="128" y2="232" stroke-width="20"/>
    <line x1="32" y1="168" x2="224" y2="168" stroke-width="20"/>
  </g>
</svg>
